services:
  postgres:
    image: postgres:16
    container_name: pulsetrade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrade
      POSTGRES_PASSWORD: pulsetrade_dev_password
      POSTGRES_DB: pulsetrade_dev
    ports:
      - "5432:5432"
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulsetrade_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/volumes/redis:/data

  backend:
    build:
      context: ./backend
    container_name: pulsetrade_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      APP_NAME: PulseTrade API
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pulsetrade:pulsetrade_dev_password@postgres:5432/pulsetrade_dev
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: pulsetrade_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
